# Flujo de trabajo para construir y desplegar el sitio a GitHub Pages
name: Deploy static content to Pages

on:
  # Se ejecuta en cada push a la rama main
  push:
    branches: ["main"]

  # Permite ejecutar este flujo de trabajo de forma manual desde la pestaña Actions
  workflow_dispatch:

# Otorga permisos para que el flujo de trabajo pueda subir a GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite solo un despliegue concurrente, omitiendo ejecuciones en cola
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Trabajo de despliegue simple
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Subimos la carpeta dist generada por Vite
          path: "./dist"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
